// Switch mappings: native backend generates keyboard/mouse events.
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"
bind "r" "+reload"
bind "ENTER" "buy"
bind "SPACE" "+jump"
bind "f" "lastinv"
bind "e" "+use"
bind "UPARROW" "autobuy"
bind "DOWNARROW" "rebuy"
bind "MWHEELUP" "invprev"
bind "MWHEELDOWN" "invnext"
bind "ESCAPE" "cancelselect"
bind "~" "toggleconsole"
bind "`" "toggleconsole"
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "TAB" "+showscores"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "0" "slot10"
setinfo "_vgui_menus" "0"
