//=============================================
// CS16 Xash3D autoexec.cfg 启动初始化
// 本版本bot为ZBot, 自动刷bot在 listenserver.cfg
// autoexec.cfg 由 userconfig.cfg exec 加载(启动执行一次)
//=============================================
bot_enable "1"
bot_quota "8"          // 总机器人数量, 改成你想要的
bot_join_after_player "0"  // 0=不用等人, 开局直接刷bot; 1=你进图bot才进来
bot_difficulty "2"     // 0简单 1普通 2困难 3专家

//=============================================
// 陀螺仪体感瞄准（掌机辅助瞄准）
//=============================================
gyro_enable "1"   // 1=开启陀螺仪瞄准, 0=关闭
touch_enable "0"   // 0=默认关闭触摸控制(用实体手柄/按键玩), 1=开启

//=============================================
// 手柄调出菜单 (触摸关闭后仍可用)
//=============================================
bind DPAD_LEFT "exec touch/bots/bots"   // 左方向键=机器人菜单
bind DPAD_UP "exec touch/cmd/cmd"        // 上方向键=命令菜单
