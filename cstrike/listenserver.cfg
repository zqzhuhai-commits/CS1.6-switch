// Use this file to configure your LISTEN server. 
// This config file is executed everytime the server changes levels.

// disable autoaim
sv_aim 0

// disable clients' ability to pause the server
pausable 0

// default server name. Change to "Bob's Server", etc.
// hostname "Counter-Strike 1.6 Server"

// maximum client movement speed 
sv_maxspeed 320

// 20 minute timelimit
// mp_timelimit 20

sv_cheats 0

// Show the standard team/player selection menus on first join.
// Keep this disabled so the first local-game connection is not left in spectator view.
mp_auto_join_team 0
humans_join_team any

//=============================================
// ZBot auto-config
// 本版本集成的bot为 ZBot(Valve零点行动官方Bot移植, nav网格自动学习)
// listenserver.cfg 在每次本地建房/加载地图时自动执行, 即自动刷bot
//=============================================
bot_enable "1"
bot_quota "8"                  // 机器人总数, 改成你要的数量
bot_quota_mode "normal"        // normal=固定数量; fill=自动补齐总人数
bot_join_after_player "1"      // 0=建房立即刷bot; 1=你进入后bot才加入
bot_difficulty "2"             // 0简单 1普通 2困难 3专家
bot_join_team "any"            // any/t/ct 随机/只T/只CT
bot_chatter "minimal"          // bot无线电语音量
mp_autoteambalance "0"         // 关闭自动平衡, 防止乱踢bot
mp_limitteams "0"
