// Nintendo Switch Joy-Con / Pro Controller layout
cl_oldtouchmenus "0"
joy_enable "1"
joystick "1"
joy_axis_binding "sfpyrl"
joy_forward "1.0"
joy_side "1.0"
joy_pitch "110.0"
joy_yaw "140.0"
joy_forward_deadzone "5000"
joy_side_deadzone "5000"
joy_pitch_deadzone "6000"
joy_yaw_deadzone "6000"
joy_lt_threshold "12000"
joy_rt_threshold "12000"

bind "LTRIGGER" "+attack2"
bind "RTRIGGER" "+attack"
bind "A_BUTTON" "+use"
bind "B_BUTTON" "+jump"
bind "X_BUTTON" "+reload"
bind "Y_BUTTON" "lastinv"
bind "L1_BUTTON" "invprev"
bind "R1_BUTTON" "invnext"
bind "BACK" "+showscores"
bind "START" "escape"
bind "STICK1" "+duck"
bind "STICK2" "+speed"
bind "L2_BUTTON" "+attack2"
bind "R2_BUTTON" "+attack"
bind "DPAD_UP" "impulse 100"
bind "DPAD_DOWN" "drop"
bind "DPAD_LEFT" "+showscores"
bind "DPAD_RIGHT" "buy"
